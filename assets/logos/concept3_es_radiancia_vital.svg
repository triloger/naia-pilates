<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <linearGradient id="roseArchGradEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1DF" />
      <stop offset="50%" stop-color="#F2B8B5" />
      <stop offset="100%" stop-color="#DE9995" />
    </linearGradient>
    <filter id="softPillShadowEs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D1113" flood-opacity="0.22" />
    </filter>
  </defs>

  <style>
    .arch-lowercase-es {
      font-family: 'Century Gothic', 'Montserrat', 'Inter', sans-serif;
      font-size: 82px;
      font-weight: 400;
      letter-spacing: 0.12em;
      fill: #461E22;
    }
    .arch-lowercase-sub-es {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.52em;
      fill: #8D5459;
    }
  </style>

  <rect width="900" height="340" fill="transparent" />

  <g transform="translate(50, 45)">
    <!-- ICON / EMBLEM: Arco Orgánico 'n' con Diéresis Gemela -->
    <g id="icon-arch-organic-es" transform="translate(25, 12)" filter="url(#softPillShadowEs)">
      <rect x="15" y="10" width="170" height="195" rx="55" fill="#522428" stroke="#EED8D6" stroke-width="1.2" />

      <path d="M 60 162 L 60 110 C 60 82, 80 66, 100 66 C 120 66, 140 82, 140 110 L 140 162" 
            fill="none" stroke="url(#roseArchGradEs)" stroke-width="12" stroke-linecap="round" />

      <circle cx="60" cy="162" r="6" fill="#FCE1DF" />
      <circle cx="140" cy="162" r="6" fill="#FCE1DF" />

      <circle cx="91" cy="40" r="5" fill="url(#roseArchGradEs)" />
      <circle cx="109" cy="40" r="5" fill="url(#roseArchGradEs)" />
    </g>

    <!-- PALABRA EN MINÚSCULA EN ESPAÑOL -->
    <g transform="translate(290, 118)">
      <text x="0" y="0" class="arch-lowercase-es">naïa</text>
      <text x="4" y="38" class="arch-lowercase-sub-es">ESTUDIO DE PILATES</text>

      <line x1="4" y1="14" x2="380" y2="14" stroke="#DCAEAB" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="185" cy="14" r="2.5" fill="#522428" />
    </g>
  </g>
</svg>
