<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <linearGradient id="waveRoseGradEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1DF" />
      <stop offset="50%" stop-color="#F2B8B5" />
      <stop offset="100%" stop-color="#D99490" />
    </linearGradient>
    <linearGradient id="cabernetPlinthEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#552227" />
      <stop offset="100%" stop-color="#381418" />
    </linearGradient>
    <filter id="softGlowRoseEs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2D1113" flood-opacity="0.22" />
    </filter>
  </defs>

  <style>
    .ribbon-title-es {
      font-family: 'Playfair Display', 'Cormorant Garamond', serif;
      font-size: 74px;
      font-weight: 500;
      letter-spacing: 0.22em;
      fill: #461E22;
    }
    .ribbon-sub-es {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.52em;
      fill: #8D5459;
    }
  </style>

  <rect width="900" height="340" fill="transparent" />

  <g transform="translate(50, 45)">
    <!-- ICON / EMBLEM -->
    <g id="icon-wave-ribbon-es" transform="translate(25, 12)" filter="url(#softGlowRoseEs)">
      <rect x="15" y="10" width="170" height="195" rx="42" fill="#522428" stroke="#EED8D6" stroke-width="1.2" />

      <path d="M 62 165 C 60 125, 62 82, 68 62 C 70 56, 76 56, 78 62 C 82 85, 80 128, 76 165 Z" 
            fill="url(#waveRoseGradEs)" />

      <path d="M 72 65 C 80 85, 105 138, 125 158 C 130 164, 136 162, 134 154 C 122 125, 105 82, 92 62 C 86 52, 76 52, 72 65 Z" 
            fill="#FCE1DF" opacity="0.9" />

      <path d="M 52 168 C 65 158, 85 174, 105 162 C 125 150, 140 166, 150 162" 
            fill="none" stroke="url(#waveRoseGradEs)" stroke-width="3" stroke-linecap="round" />

      <path d="M 125 165 C 128 135, 132 88, 136 62 C 138 56, 144 56, 145 62 C 148 88, 144 135, 140 165 Z" 
            fill="url(#waveRoseGradEs)" />

      <circle cx="96" cy="38" r="4.5" fill="url(#waveRoseGradEs)" />
      <circle cx="112" cy="38" r="4.5" fill="url(#waveRoseGradEs)" />
    </g>

    <!-- PALABRA EN ESPAÑOL -->
    <g transform="translate(290, 118)">
      <text x="0" y="0" class="ribbon-title-es">NAÏA</text>
      <text x="5" y="38" class="ribbon-sub-es">ESTUDIO DE PILATES</text>

      <path d="M 5 14 Q 90 20, 195 14 T 390 14" fill="none" stroke="#DCAEAB" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="195" cy="14" r="2.5" fill="#522428" />
    </g>
  </g>
</svg>
