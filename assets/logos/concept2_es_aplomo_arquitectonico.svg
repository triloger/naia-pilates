<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="monolithObsidianEs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2724" />
      <stop offset="50%" stop-color="#1B1715" />
      <stop offset="100%" stop-color="#0E0C0B" />
    </linearGradient>
    <linearGradient id="champagneSpecularEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD9C2" />
      <stop offset="40%" stop-color="#C5A47C" />
      <stop offset="100%" stop-color="#93724B" />
    </linearGradient>
    <filter id="monolithShadowEs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0E0C0B" flood-opacity="0.14" />
    </filter>
  </defs>

  <style>
    .monolith-title-es {
      font-family: 'Bodoni MT', 'Didot', 'Playfair Display', serif;
      font-size: 72px;
      font-weight: 400;
      letter-spacing: 0.35em;
      fill: #1A1614;
    }
    .monolith-sub-es {
      font-family: 'Futura', 'Century Gothic', 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.58em;
      fill: #7D736C;
    }
  </style>

  <rect width="880" height="340" fill="transparent" />

  <g transform="translate(50, 45)">
    <!-- MONOLITO: Tensión y Equilibrio Suspendido -->
    <g id="monolith-sculpture-es" transform="translate(35, 12)" filter="url(#monolithShadowEs)">
      <polygon points="100,6 182,112 100,218 18,112" fill="none" stroke="#EAE4DC" stroke-width="0.8" />
      <circle cx="100" cy="112" r="76" fill="#FDFBF8" stroke="#DCD3C7" stroke-width="0.6" />

      <path d="M 72 65 L 82 65 L 82 159 L 72 159 Z" fill="url(#monolithObsidianEs)" />
      <polygon points="72,65 82,65 77,58" fill="url(#champagneSpecularEs)" />
      <polygon points="72,159 82,159 77,166" fill="url(#champagneSpecularEs)" />

      <path d="M 118 65 L 128 65 L 128 159 L 118 159 Z" fill="url(#monolithObsidianEs)" />
      <polygon points="118,65 128,65 123,58" fill="url(#champagneSpecularEs)" />
      <polygon points="118,159 128,159 123,166" fill="url(#champagneSpecularEs)" />

      <path d="M 82 68 L 118 156 L 114 158 L 78 70 Z" fill="url(#champagneSpecularEs)" opacity="0.95" />

      <line x1="88" y1="42" x2="88" y2="28" stroke="#B39266" stroke-width="0.75" stroke-dasharray="1 2"/>
      <circle cx="88" cy="24" r="5" fill="url(#champagneSpecularEs)" />

      <line x1="112" y1="42" x2="112" y2="20" stroke="#B39266" stroke-width="0.75" stroke-dasharray="1 2"/>
      <circle cx="112" cy="16" r="4" fill="url(#champagneSpecularEs)" />

      <line x1="38" y1="112" x2="162" y2="112" stroke="#C5A47C" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.7"/>
    </g>

    <!-- PALABRA EN ESPAÑOL -->
    <g transform="translate(295, 118)">
      <text x="0" y="0" class="monolith-title-es">NAÏA</text>
      <text x="4" y="38" class="monolith-sub-es">ESTUDIO DE PILATES</text>

      <line x1="4" y1="14" x2="385" y2="14" stroke="url(#champagneSpecularEs)" stroke-width="1.2" />
    </g>
  </g>
</svg>
