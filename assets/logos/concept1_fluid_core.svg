<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="100%" height="100%">
  <defs>
    <!-- Kinetic Ribbon Gradients: Sculptural bronze-tinted basalt with specular light -->
    <linearGradient id="kineticDark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#151A18" />
      <stop offset="45%" stop-color="#2D3A35" />
      <stop offset="100%" stop-color="#0E1211" />
    </linearGradient>
    <linearGradient id="ribbonSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#556E63" />
      <stop offset="50%" stop-color="#8DA79B" />
      <stop offset="85%" stop-color="#C2A884" />
      <stop offset="100%" stop-color="#52685E" />
    </linearGradient>
    <linearGradient id="orbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CCA8" />
      <stop offset="50%" stop-color="#BE9F73" />
      <stop offset="100%" stop-color="#8A6C44" />
    </linearGradient>
    <filter id="galleryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101413" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .avant-title {
      font-family: 'Cormorant Garamond', 'Didot', 'Playfair Display', serif;
      font-size: 70px;
      font-weight: 300;
      letter-spacing: 0.32em;
      fill: #151A18;
    }
    .avant-sub {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.58em;
      fill: #6E7C76;
    }
  </style>

  <rect width="860" height="340" fill="transparent" />

  <g transform="translate(60, 45)">
    <!-- SCULPTURE: The Kinetic Ribbon (Brâncuși Spine in Extension) -->
    <g id="kinetic-sculpture" transform="translate(30, 10)" filter="url(#galleryShadow)">
      <!-- Spatial Orbit Guide: Hairline elliptical plane -->
      <ellipse cx="105" cy="115" rx="88" ry="88" fill="none" stroke="#E2E7E4" stroke-width="0.75" stroke-dasharray="2 4" />
      <circle cx="105" cy="115" r="74" fill="#FBFDFC" stroke="#DCE4E0" stroke-width="0.5" />

      <!-- Back Ribbon Shadow Fold (creates 3D depth) -->
      <path d="M 88 175 C 70 145, 68 85, 96 55 C 104 46, 114 48, 110 60 C 102 92, 100 135, 125 168 C 128 172, 124 178, 118 178 C 108 178, 96 178, 88 175 Z"
            fill="url(#kineticDark)" opacity="0.9" />

      <!-- Fore Ribbon Twist: Continuous kinetic stroke forming sculpted 'N' -->
      <path d="M 70 162 C 60 120, 68 68, 86 44 C 92 36, 100 38, 102 48 C 105 65, 88 115, 82 142 C 80 152, 90 158, 98 152 C 114 138, 132 94, 138 58 C 140 48, 148 48, 150 56 C 152 75, 142 124, 132 155 C 128 168, 120 178, 108 178 C 92 178, 76 174, 70 162 Z"
            fill="url(#ribbonSheen)" />

      <!-- Kinetic Accent Line: razor-thin spinal articulation curve -->
      <path d="M 86 44 C 95 80, 115 130, 140 172" fill="none" stroke="url(#orbGold)" stroke-width="1.2" stroke-linecap="round" />

      <!-- Suspended Kinetic Equilibrium Orbs (Calder Mobile Diéresis) -->
      <circle cx="95" cy="24" r="4.5" fill="url(#orbGold)" />
      <circle cx="112" cy="18" r="3.5" fill="url(#orbGold)" />

      <!-- Gravitational Anchor Needle -->
      <line x1="105" y1="185" x2="105" y2="202" stroke="#658074" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- TYPOGRAPHY: Sculptural Hairline Display Wordmark -->
    <g transform="translate(295, 118)">
      <text x="0" y="0" class="avant-title">NAÏA</text>
      
      <!-- Subtitle with architectural tracking -->
      <text x="4" y="38" class="avant-sub">PILATES STUDIO</text>

      <!-- Minimalist tension axis -->
      <line x1="4" y1="14" x2="350" y2="14" stroke="#D1DBD6" stroke-width="0.8" />
      <circle cx="160" cy="14" r="2" fill="#BE9F73" />
    </g>
  </g>
</svg>
