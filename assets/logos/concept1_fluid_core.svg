<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <!-- Deep Cabernet & Soft Rose Quartz Gradients matching user reference -->
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1DF" />
      <stop offset="45%" stop-color="#F2B8B5" />
      <stop offset="100%" stop-color="#DF9B97" />
    </linearGradient>
    <linearGradient id="wineDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#552227" />
      <stop offset="100%" stop-color="#3D171A" />
    </linearGradient>
    <filter id="softEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#260C0E" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .arch-display {
      font-family: 'Bodoni MT', 'Didot', 'Playfair Display', serif;
      font-size: 78px;
      font-weight: 300;
      letter-spacing: 0.28em;
      fill: #461E22;
    }
    .arch-sub {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.55em;
      fill: #8D5459;
    }
  </style>

  <rect width="880" height="340" fill="transparent" />

  <g transform="translate(60, 45)">
    <!-- ICON / MONOGRAM: Ultra-Tall High-Fashion Monogram with Elevated Diéresis -->
    <g id="icon-arch" transform="translate(25, 10)" filter="url(#softEmboss)">
      <!-- Outer Cabernet & Rose Frame -->
      <rect x="15" y="10" width="170" height="200" rx="36" fill="#FBF8F5" stroke="#EED8D6" stroke-width="1.2" />
      <rect x="23" y="18" width="154" height="184" rx="28" fill="#522428" />

      <!-- Sculpted High-Fashion 'N' in Rose Quartz -->
      <!-- Left Slender Stem -->
      <line x1="64" y1="58" x2="64" y2="162" stroke="url(#roseGlow)" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="64" cy="58" r="2.2" fill="#FCE1DF" />
      <circle cx="64" cy="162" r="2.2" fill="#FCE1DF" />

      <!-- Diagonal Hairline Traverse -->
      <line x1="65" y1="60" x2="135" y2="160" stroke="url(#roseGlow)" stroke-width="2.2" stroke-linecap="round" />

      <!-- Right Slender Stem -->
      <line x1="136" y1="58" x2="136" y2="162" stroke="url(#roseGlow)" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="136" cy="58" r="2.2" fill="#FCE1DF" />
      <circle cx="136" cy="162" r="2.2" fill="#FCE1DF" />

      <!-- High-Waisted A-Frame Balance Arch -->
      <line x1="78" y1="120" x2="122" y2="120" stroke="url(#roseGlow)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8" />

      <!-- The Elevated Twin Diéresis Spheres (from user board top-center) -->
      <circle cx="91" cy="38" r="4.5" fill="url(#roseGlow)" />
      <circle cx="109" cy="38" r="4.5" fill="url(#roseGlow)" />
    </g>

    <!-- TYPOGRAPHIC WORDMARK: High-Fashion Architectural NAÏA -->
    <g transform="translate(290, 118)">
      <!-- Main Brand: High-Waisted Architectural Letters -->
      <text x="0" y="0" class="arch-display">NAÏA</text>
      
      <!-- Subtitle -->
      <text x="6" y="38" class="arch-sub">PILATES STUDIO</text>

      <!-- Delicate Rose Divider with Center Pearl -->
      <line x1="6" y1="14" x2="365" y2="14" stroke="#DCAEAB" stroke-width="1" />
      <circle cx="178" cy="14" r="2.5" fill="#522428" />
    </g>
  </g>
</svg>
