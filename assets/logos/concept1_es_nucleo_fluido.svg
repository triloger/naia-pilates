<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%">
  <defs>
    <linearGradient id="fluidGradEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7062" />
      <stop offset="50%" stop-color="#7A9A8B" />
      <stop offset="100%" stop-color="#9FBAB0" />
    </linearGradient>
  </defs>

  <style>
    .brand-title-es {
      font-family: 'Cormorant Garamond', 'Didot', 'Playfair Display', serif;
      font-size: 64px;
      font-weight: 400;
      letter-spacing: 0.18em;
      fill: #1C2E35;
    }
    .brand-subtitle-es {
      font-family: 'Montserrat', 'Helvetica Neue', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.38em;
      fill: #617872;
    }
    .accent-dot-es {
      fill: #7A9A8B;
    }
  </style>

  <rect width="840" height="320" fill="transparent" />

  <g transform="translate(50, 40)">
    <!-- ICONO: Flujo de Náyade y Columna Vertebral -->
    <g id="icon-mark-es" transform="translate(40, 10)">
      <circle cx="100" cy="110" r="94" fill="none" stroke="#E3EAE6" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="100" cy="110" r="88" fill="#F8FAF9" stroke="#CFDBD5" stroke-width="0.8"/>

      <!-- Onda ascendente izquierda -->
      <path d="M 72 170 C 65 140, 70 95, 78 62 C 80 54, 86 52, 90 60 C 95 72, 90 100, 86 125 C 83 145, 80 162, 72 170 Z" 
            fill="url(#fluidGradEs)" opacity="0.95" />
      
      <!-- Cinta de columna vertebral en transición -->
      <path d="M 85 64 C 95 85, 120 145, 134 162 C 137 166, 142 165, 140 158 C 132 135, 115 88, 102 66 C 96 56, 88 56, 85 64 Z" 
            fill="#1C2E35" opacity="0.85" />

      <!-- Cresta derecha -->
      <path d="M 124 165 C 130 135, 133 90, 126 58 C 124 49, 129 46, 133 52 C 140 64, 144 95, 140 128 C 137 150, 132 162, 124 165 Z" 
            fill="url(#fluidGradEs)" />

      <!-- Perlas de respiración (Diéresis) -->
      <circle cx="97" cy="40" r="4" fill="url(#fluidGradEs)" />
      <circle cx="113" cy="40" r="4" fill="url(#fluidGradEs)" />

      <path d="M 45 110 C 65 105, 75 115, 95 110 C 115 105, 135 115, 155 110" 
            fill="none" stroke="#7A9A8B" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- PALABRA DE MARCA EN ESPAÑOL -->
    <g transform="translate(290, 115)">
      <text x="0" y="0" class="brand-title-es">NAÏA</text>
      <text x="4" y="38" class="brand-subtitle-es">ESTUDIO DE PILATES</text>

      <line x1="4" y1="16" x2="340" y2="16" stroke="#D1DDD8" stroke-width="1" />
      <circle cx="172" cy="16" r="2.5" class="accent-dot-es" />
    </g>
  </g>
</svg>
