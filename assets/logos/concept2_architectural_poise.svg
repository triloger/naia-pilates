<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BA97" />
      <stop offset="45%" stop-color="#B8976C" />
      <stop offset="100%" stop-color="#967448" />
    </linearGradient>
    <linearGradient id="espressoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2523" />
      <stop offset="100%" stop-color="#1A1615" />
    </linearGradient>
  </defs>

  <style>
    .arch-title {
      font-family: 'Bodoni MT', 'Didot', 'Cinzel', 'Playfair Display', serif;
      font-size: 68px;
      font-weight: 500;
      letter-spacing: 0.22em;
      fill: #221E1C;
    }
    .arch-subtitle {
      font-family: 'Futura', 'Century Gothic', 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.55em;
      fill: #8A7E78;
    }
    .diaeresis-dot {
      fill: url(#bronzeGrad);
    }
  </style>

  <rect width="800" height="320" fill="transparent" />

  <g transform="translate(60, 40)">
    <!-- MONOGRAM EMBLEM: Architectural Alignment & Balance Monogram -->
    <g id="arch-icon" transform="translate(45, 15)">
      <!-- Precision Geometry Diamond & Circle Framing -->
      <polygon points="100,10 185,110 100,210 15,110" fill="none" stroke="#EAE4DC" stroke-width="1.2" />
      <circle cx="100" cy="110" r="76" fill="none" stroke="#D8CFC4" stroke-width="0.8" />
      <circle cx="100" cy="110" r="72" fill="#FAF8F5" />

      <!-- Minimalist Architectural 'N' with Balanced Vertices -->
      <!-- Left Column: Slender Precision Pillar -->
      <line x1="78" y1="62" x2="78" y2="158" stroke="url(#espressoGrad)" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="78" cy="60" r="2.5" fill="url(#bronzeGrad)" />
      <circle cx="78" cy="160" r="2.5" fill="url(#bronzeGrad)" />

      <!-- Diagonal Traverse: Tapered Precision Angle -->
      <path d="M 79 64 L 121 156" stroke="url(#bronzeGrad)" stroke-width="3" stroke-linecap="round" />

      <!-- Right Column: Parallel Axis Pillar -->
      <line x1="122" y1="62" x2="122" y2="158" stroke="url(#espressoGrad)" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="122" cy="60" r="2.5" fill="url(#bronzeGrad)" />
      <circle cx="122" cy="160" r="2.5" fill="url(#bronzeGrad)" />

      <!-- The Signature Naïa Twin Diaeresis Balance Spheres -->
      <circle cx="93" cy="38" r="4.5" class="diaeresis-dot" />
      <circle cx="107" cy="38" r="4.5" class="diaeresis-dot" />

      <!-- Subtle Horizon Alignment Axis -->
      <line x1="50" y1="110" x2="150" y2="110" stroke="#B8976C" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>
    </g>

    <!-- TYPOGRAPHIC WORDMARK -->
    <g transform="translate(290, 115)">
      <text x="0" y="0" class="arch-title">NAÏA</text>
      
      <!-- Subtitle -->
      <text x="5" y="38" class="arch-subtitle">PILATES STUDIO</text>

      <!-- Minimalist Line Accent -->
      <line x1="4" y1="16" x2="340" y2="16" stroke="url(#bronzeGrad)" stroke-width="1.2" />
    </g>
  </g>
</svg>
